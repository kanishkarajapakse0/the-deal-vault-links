name: Deploy Deal Vault Links

on:
  push:
    branches: ["main"] # Change to "master" if your primary branch uses that name
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '.' # Serves your static site files straight from the root directory

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v6