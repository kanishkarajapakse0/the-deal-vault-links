        /* Base Styles */
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {

            background: #0f172a; 
            color: white; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            padding: 40px 20px; 
            min-height: 100vh;
        }

        .profile-img { width: 96px; height: 96px; border-radius: 50%; border: 3px solid #38bdf8; margin-bottom: 16px; }
        h1 { font-size: 1.5rem; margin-bottom: 8px; text-align: center; }
        p { color: #94a3b8; margin-bottom: 24px; text-align: center; }

        /* Search Bar Section */
        .search-container { 
            width: 100%; 
            max-width: 400px; 
            margin-bottom: 32px; 
            background: #1e293b;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #334155;

        .search-label {
            display: block;
            font-size: 0.875rem;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .search-form { display: flex; gap: 8px; }
        .search-input { 
            flex: 1; 
            padding: 12px 16px; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            outline: none; 
            font-size: 1rem; 
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #38bdf8; }
        .search-input::placeholder { color: #64748b; }
        .search-button { 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: none; 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .search-button:hover { background: #0ea5e9; }
        .error-msg { 
            color: #ef4444; 
            font-size: 0.875rem; 
            margin-top: 8px; 
            display: none; 
        }

        /* Standard Links Section */
        .links-wrapper { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .link-card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 16px; 
            border-radius: 12px; 
            text-decoration: none; 
            color: white; 
            text-align: center; 
            transition: all 0.2s; 
            font-weight: 600; 
            display: block;
        }
        .link-card:hover { 
            background: #38bdf8; 
            color: #0f172a; 
            transform: translateY(-2px); 
            border-color: #38bdf8;
        }
        .badge { 
            background: #ef4444; 
            color: white;
            font-size: 0.7rem; 
            padding: 2px 8px; 
            border-radius: 99px; 
            margin-left: 8px; 
            vertical-align: middle; 
        }
    </style>

                // Code found! Hide error and redirect in the same tab 
                // (better for mobile affiliate tracking in Instagram/YT browsers)
                errorMsg.style.display = 'none';
                codeInput.value = 'Redirecting...';
                window.location.href = targetUrl;
            } else {
                // Code not found, show error
                errorMsg.style.display = 'block';
                // Shake animation effect for visual feedback
                codeInput.style.transform = 'translateX(5px)';
                setTimeout(() => codeInput.style.transform = 'translateX(-5px)', 100);
                setTimeout(() => codeInput.style.transform = 'translateX(0)', 200);
            }
        });

        codeInput.addEventListener('input', function() {
