        .search-input {

            padding: 12px 16px; 
            border-radius: 8px; 
            border: 1px solid #475569; 
            background: #0f172a; 
            color: white; 
            outline: none; 
            font-size: 1rem; 
            transition: border-color 0.2s;
        }
        .search-input:focus { border-color: #38bdf8; }
        .search-input::placeholder { color: #64748b; }
        .search-button { 
            padding: 12px 20px; 
            border-radius: 8px; 
            border: none; 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.2s; 
        }
        .search-button:hover { background: #0ea5e9; }
        .error-msg { 
            color: #ef4444; 
            font-size: 0.875rem; 
            margin-top: 8px; 
            display: none; 
        }

        /* Standard Links Section */
        .links-wrapper { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 12px; }
        .link-card { 
            background: #1e293b; 
            border: 1px solid #334155; 
            padding: 16px; 
            border-radius: 12px; 
            text-decoration: none; 
            color: white; 
            text-align: center; 
            transition: all 0.2s; 
            font-weight: 600; 
            display: block;
        }
        .link-card:hover { 
            background: #38bdf8; 
            color: #0f172a; 
            transform: translateY(-2px); 
            border-color: #38bdf8;
        }
        .badge { 
            background: #ef4444; 
            color: white;
            font-size: 0.7rem; 
            padding: 2px 8px; 
            border-radius: 99px; 
            margin-left: 8px; 
            vertical-align: middle;
